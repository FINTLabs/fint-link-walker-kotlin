# Dependabot is on for this repo. It opens no pull requests for version updates
# (open-pull-requests-limit: 0), because each push to main deploys this service.
# Security updates can still open pull requests. Their commit messages have [skip ci],
# so a squash merge of such a pull request starts no workflow and no deploy.
version: 2
registries:
  fintlabs:
    type: maven-repository
    url: https://repo.fintlabs.no/releases
updates:
  - package-ecosystem: "gradle"
    registries:
      - fintlabs
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "[skip ci] deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "[skip ci] deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "[skip ci] deps"
